#####################################################################################
#
# NKP expanded binaries directory in user's home directory
#
#####################################################################################

export NKP_DIRECTORY="${HOME}/nkp-v2.17.0/"

#####################################################################################
#
# Ignore this for now
#
# Script automation for NDK install pending 
# Directory to locate NDK (procedure not yet documented)
#
#####################################################################################

#export NDK_DIRECTORY="${HOME}/ndk-1.3.0/"

#####################################################################################
#
# Prism Central credentials
#
#####################################################################################

export NUTANIX_USER='admin'
export NUTANIX_PASSWORD='nx2Tech151!'
export NUTANIX_PORT=9440

#####################################################################################
#
# This portion not used
# But we will leave it here as I intend to use it in the future
#
#####################################################################################

export LOCAL_REGISTRY='https://10.10.2.14:5000'
#export MIRROR_REGISTRY='https://mirror.gcr.io'

######################################################################################
#
# General Prism Central connectivity variables
#
# This section should change everytime there is a new HPOC
#
######################################################################################

# This is the name of the HPOC AHV Cluster onto which you are installing the NKP
# management cluster
export HPOC_CLUSTER='DM3-POC083'

# PRISM CENTRAL ENDPOINT
#
# This is the actual VIP of Prism Central and not an IP address inside any VPC
#
export PRISMCENTRAL_ENDPOINT='10.55.83.7'

######################################################################################
#
# We define the variables for the actual NKP management cluster here
#
######################################################################################

# This is the name to give the new NKP management Cluster
export NKPCLUSTER_NAME='practice1'

# New NKP Management Cluster API Server VIP
# This is the floating IP of the NKP Management server's API Server
# This should be an IP INSIDE of the VPC and be an IP of the VPC subnet
export NKPAPISERVER_VIP='10.10.2.17'

# This Floating IP should be external subnet IP assigned to the 
# NKP Mangement Cluster API Service inside the VPC
export FloatingIP_APIServer='10.55.83.228'

# Load Balancer IP Range
# This should be an IP range INSIDE the VPC
# This IP range must NOT belong to a range managed by IPAM of the
# subnet INSIDE the VPC
# Be careful here!
# This IP range need not be large. I have provided an example
# arbitrary range but most of the NKP workload will flow through
# the single ingress controller
export LOAD_BALANCER_IP_RANGE='10.10.2.20-10.10.2.30'

# Load Balancer External subnet Floating IP that is assigned to
# the first IP of the LB IP range
# We have to do this because the single ingress controller will
# take the first IP of the Load Balancer range defined earlier
export FloatingIP_LBFirstIP='10.55.83.216'

# The name of the subnet inside the VPC
export VPC_CONTROLPLANE_SUBNET='vpc1-subnet1'
export VPC_WORKER_SUBNET='vpc1-subnet1'

######################################################################################
#
# This section defines the rest of the variables like storage container
# image bundles etc
#
######################################################################################

# AOS Storage Container to house the Control Plane and Worker nodes VM
# Please ensure you create this in Prism Central
export CSI_STORAGE_CONTAINER='nkp-vpc1'

# Prism Central Project
# Please ensure you create this in Prism Central
export PC_PROJECT='nkp-vpc1'

# Control Plane and Worker Node image name
# This must be uploaded to Prism Central
# Ensure you remove the qcow2 extension
export VM_IMAGE_NAME='nkp-ubuntu-24.04-release-cis-1.34.1-20251206061851'

# Images to push onto the management cluster default repo
export NKP_BUNDLES="${NKP_DIRECTORY}/container-images/kommander-image-bundle-v2.17.0.tar,${NKP_DIRECTORY}/container-images/konvoy-image-bundle-v2.17.0.tar" \

# Categories
# Very useful in listing the VMs
# Please ensure you create this in Prism Central Admin Categories panel
CONTROLPLANE_PC_CATEGORIES='Environment=Dev,nodetype=controlplane,clustertype=management'
WORKERNODE_PC_CATEGORIES='Environment=Dev,nodetype=worker,clustertype=management'
######################################################################################
