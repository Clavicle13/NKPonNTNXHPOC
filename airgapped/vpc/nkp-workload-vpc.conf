######################################################################################
#
# NKP Management Cluster Configuration File
#
######################################################################################

######################################################################################
#
# Deployment Mode: Set to TRUE if deploying inside a VPC with a Bastion inside the VPC
#
######################################################################################
export INSIDE_VPC='TRUE'

################################################################################
#
# NKP Binaries and Bundles
#
################################################################################
export NKP_DIRECTORY="${HOME}/nkp-v2.17.1"
export NKP_BUNDLES="${NKP_DIRECTORY}/container-images/kommander-image-bundle-v2.17.1.tar,${NKP_DIRECTORY}/container-images/konvoy-image-bundle-v2.17.1.tar"

################################################################################
#
# Nutanix Infrastructure Details
#
################################################################################
export HPOC_CLUSTER='DM3-POC113'
export PRISMCENTRAL_ENDPOINT='10.54.62.7'
export NUTANIX_USER='admin'
export NUTANIX_PASSWORD='nx2Tech313!' # Ensure this matches your PC credentials

################################################################################
#
# Cluster Metadata and Hardware
#
################################################################################
export NKP_WORKLOAD_CLUSTER_NAME='salary'
export VM_IMAGE_NAME='nkp-ubuntu-24.04-release-cis-1.34.3-20260226170017'
export CSI_STORAGE_CONTAINER='nkp-vpc1'
export PC_PROJECT='nkp-vpc1'

################################################################################
#
# NKP Workload Server API Server IP address (IP address should be IP INSIDE VPC)
#
################################################################################
export NKPAPISERVER_VIP='10.10.2.37'       # Internal VIP for VPC or cluster VIP for no-VPC

################################################################################
#
# The Workspace onto which this workload cluster is to be deployed to
#
################################################################################
export WORKSPACE_NAMESPACE='finance-nh9tv-jw6b8'

################################################################################
#
# This value needs to be change!
# It must reflect the assigned external subnet Floating IP assigned to
# the NKP management cluster API Server
#
################################################################################
export FloatingIP_APIServer='10.54.62.227' # External Floating IP for VPC access

################################################################################
#
# NKP Management Server Load Blaancer Range (IP address range should be INSIDE VPC)
#
################################################################################
export LOAD_BALANCER_IP_RANGE='10.10.2.40-10.10.2.50'

################################################################################
#
# This value needs to be change!
# It must reflect the assigned external subnet Floating IP assigned to
# the FIRST IP of the NKP management cluster Load Balancer range
#
################################################################################
export FloatingIP_LBFirstIP='10.54.62.194' # External IP assigned to LB range

################################################################################
#
# The VPC subnet that the NKP managment cluster is to be installed in
# Must be the same VPC that the Bastion host is in
#
################################################################################
export VPC_CONTROLPLANE_SUBNET='vpc1-subnet1'
export VPC_WORKER_SUBNET='vpc1-subnet1'

################################################################################
#
# Categories for Organization
#
################################################################################
export CONTROLPLANE_PC_CATEGORIES='Environment=Dev,nodetype=controlplane,clustertype=workload'
export WORKERNODE_PC_CATEGORIES='Environment=Dev,nodetype=worker,clustertype=workload'
