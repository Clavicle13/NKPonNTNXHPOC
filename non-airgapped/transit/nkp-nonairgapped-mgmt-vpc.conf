######################################################################################
#
# NKP Management Cluster Configuration File
#
######################################################################################

######################################################################################
#
# Deployment Mode:
#
#	Should set to TRUE if deploying inside a VPC and there is NO transit VPC
#	
#	In this case, we are using a Transit VPC so it should be FALSE
#
######################################################################################
export INSIDE_VPC='FALSE'

export SSH_KEY_PATH="${HOME}/.ssh/id_ed25519.pub"

################################################################################
#
# NKP Binaries and Bundles
#
################################################################################
export NKP_NONAIRGAPPED_DIR="${HOME}/non-airgapped/"
export NKP_VERSION="v2.19.0"
export NKP_DIRECTORY="${HOME}/nkp-${NKP_VERSION}/"
export NKP_BUNDLES="${NKP_DIRECTORY}/container-images/kommander-image-bundle-${NKP_VERSION}.tar,${NKP_DIRECTORY}/container-images/konvoy-image-bundle-${NKP_VERSION}.tar"

echo "${NKP_NONAIRGAPPED_DIR}"
echo "${NKP_VERSION}"
echo "${NKP_DIRECTORY}"
echo "${NKP_BUNDLES}"

################################################################################
#
# Nutanix Infrastructure Details
#
################################################################################
export HPOC_CLUSTER='BLR-POC224'
export PRISMCENTRAL_ENDPOINT='10.136.224.7'
export NUTANIX_USER='admin'
export NUTANIX_PASSWORD='nx2Tech547!' # Ensure this matches your PC credentials

################################################################################
#
# Cluster Metadata and Hardware
#
################################################################################
export BASTIONIP='20.20.20.14'
export NKPCLUSTER_NAME='practice1'
export VM_IMAGE_NAME='nkp-ubuntu-24.04-release-cis-1.36.2-20261014170313'
export CSI_STORAGE_CONTAINER='instructor'
export PC_PROJECT='instructor'

################################################################################
#
# NKP Management Server API Server IP address (IP address should be IP INSIDE VPC)
#
################################################################################
export NKPAPISERVER_VIP='172.16.10.17'       # Internal VIP for VPC or cluster VIP for no-VPC

################################################################################
#
# NKP Management Server Load Balancer Range (IP address range should be INSIDE VPC)
#
################################################################################
export LOAD_BALANCER_IP_RANGE='172.16.10.120-172.16.10.130'

################################################################################
#
# The VPC subnet that the NKP managment cluster is to be installed in
# Must be the same VPC that the Bastion host is in
#
################################################################################
export VPC_CONTROLPLANE_SUBNET='instructorVPC_spoke1_subnet1'
export VPC_WORKER_SUBNET='instructorVPC_spoke1_subnet1'

################################################################################
#
# Categories for Organization
#
################################################################################
export CONTROLPLANE_PC_CATEGORIES='Environment=Dev,nodetype=controlplane,clustertype=management'
export WORKERNODE_PC_CATEGORIES='Environment=Dev,nodetype=worker,clustertype=management'
