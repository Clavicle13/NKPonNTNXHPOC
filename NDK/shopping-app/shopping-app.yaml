---
# 1. NAMESPACE (With Istio Sidecar Injection Enabled!)
apiVersion: v1
kind: Namespace
metadata:
  name: shopping-demo
  labels:
    istio.io/rev=istio-helm
---
# 2. SECRET (Database Password)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: shopping-demo
type: Opaque
stringData:
  POSTGRES_PASSWORD: "supersecretpassword"
---
# 3. CONFIGMAP (App Configurations)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shopping-demo
data:
  VOTE_OPTIONS: "Apples vs Oranges"
---
# 4. DATABASE (PostgreSQL with PVC for NDK)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: shopping-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: shopping-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shopping-demo
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: db
---
# 5. REDIS (Session/Queue Cache)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shopping-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shopping-demo
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
---
# 6. WORKER (Processes Redis queue into DB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shopping-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: dockersamples/examplevotingapp_worker
---
# 7. FRONTEND WEB (The User UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: shopping-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote:before
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: shopping-demo
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: vote

