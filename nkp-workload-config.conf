#
# This is the directory which is the expanded directory tree from the nkp air-gapped
# tar file
# 
# This should be under your user HOME directory
#
#####################################################################################

export NKP_DIRECTORY="${HOME}/nkp-v2.16.1/"

#####################################################################################
#
#####################################################################################

export NDK_DIRECTORY="${HOME}/ndk-1.3.0/"

#####################################################################################
#
# This is the workspace in which the workload cluster will be created
# The workspace MUST first be created
#
# Do be careful. The actual namespace will have additional characters
# appeneded to the name in the initial creation of the workspace as in the example
# below
#
#####################################################################################

export WORKSPACE_NAMESPACE='partnerdemo-mnxdr-7djd9'

#####################################################################################
#
# Prism Central credentials
#
#####################################################################################

export NUTANIX_USER='admin'
export NUTANIX_PASSWORD='nx2Tech670!'
export NUTANIX_PORT=9440

#####################################################################################
#
# This is the external docker.io registry mirror
# In this case we are using the Google Container Register as the docker.io mirror
#
#####################################################################################

export MIRROR_REGISTRY='https://mirror.gcr.io'

# This is the name to give the new NKP workload cluster
export NKPCLUSTER_NAME='workload1'

