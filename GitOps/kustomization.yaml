apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-gitops-demo
  namespace: kommander-default-workspace
spec:
  interval: 1m
  path: "./management-infra" # Flux will look in this folder
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitea-repo
  # We leave out targetNamespace so it applies exactly what is in the YAMLs
